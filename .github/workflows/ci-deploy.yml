name: CI + Deploy

# Pe orice pull request spre main: rulează TOATE verificările (site + bot), fără
# deploy. Regula de pe `main` (ruleset-ul descris în CI-CD.md) cere ca ele să fie
# verzi înainte de merge.
#
# Pe push în main (adică merge-ul unui PR): aceleași verificări, apoi — doar dacă
# trec — deploy-ul Vercel (deploy hook) și verificarea pe LIVE că build-ul nou e
# chiar sus. Auto-deploy-ul git al Vercel e dezactivat (vercel.json
# git.deploymentEnabled), deci acest pipeline e singura cale spre producție.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Un singur pipeline per PR sau branch. Pe un PR, un push nou face rularea
  # veche inutilă, deci o anulăm; pe main nu anulăm niciodată un deploy în curs.
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # „Verificări" e împărțit în trei job-uri care rulează DEODATĂ (static, teste
  # unitare, e2e în două bucăți), plus o poartă care le adună. Înainte erau pași
  # la rând, într-un singur job: ~3m40s. Acum durează cât cel mai lung dintre ele.
  static:
    name: Verificări — linter, cod mort, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Același Node peste tot: local (fnm/nvm citesc `.nvmrc`), aici, pe
          # Vercel și pe Railway (`engines` = 24.x). LTS-ul curent.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Linter + cod mort
        run: |
          npm run lint
          npm run deadcode
      - name: Typecheck (app + teste)
        run: |
          npm run typecheck
          npm run typecheck:tests

  unit:
    name: Verificări — teste unitare (cu acoperire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Cu acoperire, nu doar cu rezultate: pragurile din `vitest.config.ts` sunt
      # un clichet — urcă pe măsură ce acoperirea crește, nu coboară niciodată.
      - name: Teste unitare (cu prag de acoperire)
        run: npm run test:coverage

  e2e:
    name: Verificări — e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      # O bucată picată nu o oprește pe cealaltă: vezi toate eșecurile odată.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Browserul se schimbă doar când se schimbă versiunea Playwright din
      # lockfile, deci cheia e chiar ea. Fără cache, descărcarea costa ~28s la
      # fiecare rulare.
      - name: Versiunea Playwright (cheie de cache)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsere Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Pași separați: logurile apt/Playwright sunt vizibile cât rulează.
      - name: Build (cu garda CSP↔config)
        timeout-minutes: 5
        run: npm run build

      - name: Instalează browserul Playwright (încercarea 1/2)
        id: pw-install
        timeout-minutes: 5
        continue-on-error: true
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$PW_CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # outcome păstrează eșecul inițial chiar cu continue-on-error.
      # Timeout-ul este tot eșec; anularea manuală nu pornește un retry.
      - name: Reîncearcă instalarea Playwright (încercarea 2/2)
        if: ${{ !cancelled() && steps.pw-install.outcome == 'failure' }}
        timeout-minutes: 5
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          echo "::warning::Prima instalare Playwright a eșuat sau a depășit 5 minute. Reîncerc o singură dată."
          if [ "$PW_CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Pe build-ul de producție, nu pe dev server, și doar jumătatea lui din
      # suită (`--shard`). Pe CI, Playwright folosește toate nucleele runner-ului
      # (`workers` din `playwright.config.ts`).
      - name: Teste e2e (pe build-ul de producție)
        run: npm run test:e2e:preview -- --shard=${{ matrix.shard }}/2

      # Reporterul e `list`, deci nu există raport HTML. Ce ajută la depanare
      # sunt urmele scrise de `trace: 'on-first-retry'`, în `test-results/`.
      - name: Urmele Playwright, la eșec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Poarta. Are NUMELE vechiului job unic, pe care îl cere regula de pe `main`
  # (scripts/ruleset-main.json), deci regula nu se schimbă.
  #
  # `if: always()` e obligatoriu: fără el, când un job de mai sus pică, poarta e
  # „skipped" — iar GitHub socotește o verificare obligatorie „skipped" ca
  # TRECUTĂ. Așa, poarta rulează mereu și pică singură dacă ceva n-a reușit
  # (inclusiv „cancelled" sau „skipped").
  test:
    name: Verificări (typecheck + teste + build)
    needs: [static, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Toate verificările au trecut
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "static=$STATIC unit=$UNIT e2e=$E2E"
          for r in "$STATIC" "$UNIT" "$E2E"; do
            if [ "$r" != "success" ]; then
              echo "::error::O verificare n-a trecut (static=$STATIC, unit=$UNIT, e2e=$E2E)."
              exit 1
            fi
          done

  # Botul de Telegram (`bot/`), deployat pe Railway din acest repo. Nu e un
  # pas al deploy-ului Vercel: serviciul Railway are „Wait for CI" pornit, deci
  # așteaptă ca TOATE job-urile de pe commit să treacă înainte să ia codul nou.
  # Node din `.nvmrc` (24): `supabase-js` cade pe Node 20 la rulare (vezi
  # bot/README.md și `bot/test/smoke.test.ts`).
  bot:
    name: Botul de Telegram (teste + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            bot/package-lock.json
            .railway/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Serviciul Railway e descris în `.railway/railway.ts` (Infrastructure as
      # Code). CI-ul nu-l aplică — `railway config apply` e un pas explicit —, dar
      # nu lasă să intre în `main` un fișier pe care CLI-ul nu l-ar putea citi.
      - name: Configurația Railway (.railway/) se compilează
        working-directory: .railway
        run: |
          npm ci
          npm run typecheck
      # Testele și `tsc` nu pornesc botul: un import care cade abia la rulare
      # (ESM fără `.js`, o dependență lipsă) ar trece verde și ar ajunge pe
      # Railway. Aici `dist/` pornește de-adevăratelea și trebuie să răspundă pe
      # `/health`. Fără variabile de Telegram și cu o bază falsă: nu pleacă
      # nimic nicăieri, iar clientul Supabase se construiește abia la primul tic.
      - name: Botul construit pornește și răspunde pe /health
        env:
          PORT: '3999'
          SUPABASE_URL: http://127.0.0.1:9
          SUPABASE_SERVICE_ROLE_KEY: ci-fara-cheie
        run: |
          node dist/index.js > pornire.log 2>&1 &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3999/health; then
              kill "$PID"
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Botul s-a oprit la pornire:"
              cat pornire.log
              exit 1
            fi
            sleep 1
          done
          echo "Botul n-a răspuns pe /health în 20 de secunde:"
          cat pornire.log
          kill "$PID"
          exit 1

  deploy:
    name: Deploy Vercel + verificare live
    needs: test
    # Doar din main: nici un PR, nici o rulare manuală pornită de pe alt branch
    # nu publică. Pe un PR job-ul apare „skipped", iar asta nu blochează merge-ul.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Job-ul are nevoie de exact două fișiere: scriptul de verificare și
      # `vercel.json` (din care citește CSP-ul așteptat). Un checkout parțial
      # e destul — și nu există `setup-node`, pentru că scriptul e Node pur,
      # iar runner-ul vine deja cu Node 20+.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/check-live-deploy.mjs
            vercel.json
          sparse-checkout-cone-mode: false

      - name: Declanșează deploy-ul Vercel (deploy hook)
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secretul VERCEL_DEPLOY_HOOK_URL lipsește. Vezi CI-CD.md."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Deploy declanșat pentru ${GITHUB_SHA:0:8}."

      - name: Verifică pe live că build-ul nou e sus (+ CSP corect)
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://parktraining.fit
          TIMEOUT_MS: '240000'
        run: node scripts/check-live-deploy.mjs
